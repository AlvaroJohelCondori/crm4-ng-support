<div class="app-container">
  <!-- Barra de navegación superior -->
  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button (click)="toggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Soporte HBM COFAR</span>
    <span class="toolbar-spacer"></span>
    <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button>
    <button mat-icon-button>
      <mat-icon>settings</mat-icon>
    </button>
  </mat-toolbar>

  <!-- Contenedor principal con menú lateral y área de contenido -->
  <mat-sidenav-container class="app-sidenav-container">
    <mat-sidenav [opened]="isMenuOpen" mode="side" class="app-sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Inicio</span>
        </a>
        <a mat-list-item routerLink="/clientes">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Clientes</span>
        </a>
        <a mat-list-item routerLink="/productos">
          <mat-icon matListItemIcon>inventory</mat-icon>
          <span matListItemTitle>Productos</span>
        </a>
        <a mat-list-item routerLink="/ventas">
          <mat-icon matListItemIcon>shopping_cart</mat-icon>
          <span matListItemTitle>Ventas</span>
        </a>
        <a mat-list-item routerLink="/reportes">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Reportes</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <!-- Área de contenido principal -->
    <mat-sidenav-content class="app-content">
      <div class="content-container">
        <mat-card>
          <mat-card-header>
            <mat-card-title>Bienvenido al Sistema</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p>
              Este es el layout básico de tu aplicación Angular con Angular
              Material.
            </p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-raised-button color="primary">Comenzar</button>
          </mat-card-actions>
        </mat-card>
      </div>

      <!-- Router outlet para mostrar los componentes según la ruta -->
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
