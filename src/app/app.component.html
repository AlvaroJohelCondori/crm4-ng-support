<div class="app-container">
  <mat-toolbar class="app-toolbar">
    <button mat-icon-button (click)="toggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Soporte HBM COFAR</span>
    <span class="toolbar-spacer"></span>
    <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button>
    <button mat-icon-button>
      <mat-icon>settings</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="app-sidenav-container">
    <mat-sidenav [opened]="isMenuOpen" mode="side" class="app-sidenav">
      <mat-accordion multi>
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon class="panel-icon">point_of_sale</mat-icon>
              Ventas
            </mat-panel-title>
          </mat-expansion-panel-header>
          <mat-nav-list>
            <a
              mat-list-item
              routerLink="/sales/visits"
              routerLinkActive="active-link"
            >
              <mat-icon matListItemIcon>home</mat-icon>
              <span matListItemTitle>Visitas</span>
            </a>
            <a mat-list-item routerLink="/clientes">
              <mat-icon matListItemIcon>shopping_cart</mat-icon>
              <span matListItemTitle>Pedidos</span>
            </a>
            <a mat-list-item routerLink="/productos">
              <mat-icon matListItemIcon>payments</mat-icon>
              <span matListItemTitle>Cobranzas</span>
            </a>
            <a mat-list-item routerLink="/ventas">
              <mat-icon matListItemIcon>group</mat-icon>
              <span matListItemTitle>Usuarios</span>
            </a>
          </mat-nav-list>
        </mat-expansion-panel>

        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon class="panel-icon">local_shipping</mat-icon>
              Distribución
            </mat-panel-title>
          </mat-expansion-panel-header>
          <mat-nav-list>
            <a
              mat-list-item
              routerLink="/distribution/visits"
              routerLinkActive="active-link"
            >
              <mat-icon matListItemIcon>home</mat-icon>
              <span matListItemTitle>Visitas</span>
            </a>
            <a mat-list-item routerLink="/dist-clientes">
              <mat-icon matListItemIcon>inventory_2</mat-icon>
              <span matListItemTitle>Entregas</span>
            </a>
            <a mat-list-item routerLink="/productos">
              <mat-icon matListItemIcon>payments</mat-icon>
              <span matListItemTitle>Cobranzas</span>
            </a>
            <a mat-list-item routerLink="/ventas">
              <mat-icon matListItemIcon>group</mat-icon>
              <span matListItemTitle>Usuarios</span>
            </a>
          </mat-nav-list>
        </mat-expansion-panel>
      </mat-accordion>
    </mat-sidenav>

    <mat-sidenav-content class="app-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
