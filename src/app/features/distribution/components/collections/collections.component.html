<div class="search-and-filter-container">
  <button
    mat-raised-button
    color="primary"
    class="column-selector-button"
    (click)="openDialog()"
  >
    <mat-icon>view_column</mat-icon>
    Columnas
  </button>

  <mat-form-field>
    <mat-label>Búsqueda General</mat-label>
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar..."
      #input
    />
  </mat-form-field>

  <mat-paginator
    [pageSize]="defaultPageSize"
    [pageSizeOptions]="[10, 20, 50, 100]"
    showFirstLastButtons
    aria-label="Seleccionar página de visitas"
  ></mat-paginator>
</div>

<div class="example-container">
  <div class="loading-overlay" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Cargando datos...</span>
  </div>

  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container *ngFor="let column of allColumns">
      <ng-container [matColumnDef]="column.value">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ column.viewValue }}
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          (click)="copyToClipboard(row[column.value])"
          class="copyable-cell"
        >
          <div class="cell-content">
            <span>{{ row[column.value] }}</span>
            <mat-icon class="copy-icon">content_copy</mat-icon>
          </div>
        </td>
      </ng-container>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button
          mat-icon-button
          color="primary"
          (click)="$event.stopPropagation(); updateReceiptDate(row)"
          matTooltip="Actualizar Fecha"
        >
          <mat-icon>update</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="columnsToDisplay.concat(['actions'])"
    ></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: columnsToDisplay.concat(['actions'])"
    ></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="columnsToDisplay.length + 1">
        <span *ngIf="!isLoading"
          >No se encontraron datos que coincidan con "{{ input.value }}"</span
        >
      </td>
    </tr>
  </table>
</div>
