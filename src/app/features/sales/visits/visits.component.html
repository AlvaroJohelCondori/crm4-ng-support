<div class="column-selector-container">
  <mat-form-field class="column-selector">
    <mat-label>Seleccionar columnas</mat-label>
    <mat-select
      [(ngModel)]="columnsToDisplay"
      multiple
      (selectionChange)="updateDisplayedColumns($event.value)"
    >
      <div class="select-all-option">
        <mat-checkbox
          [checked]="areAllColumnsSelected()"
          [indeterminate]="
            columnsToDisplay.length > 0 && !areAllColumnsSelected()
          "
          (change)="toggleAllColumns($event.checked)"
        >
          Seleccionar todo
        </mat-checkbox>
      </div>
      <mat-divider></mat-divider>

      <mat-option *ngFor="let column of allColumns" [value]="column.value">
        {{ column.viewValue }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

<mat-form-field>
  <mat-label>Búsqueda General</mat-label>
  <input
    matInput
    (keyup)="applyFilter($event)"
    placeholder="Buscar..."
    #input
  />
</mat-form-field>

<div class="example-container">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container *ngFor="let column of allColumns">
      <ng-container [matColumnDef]="column.value">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ column.viewValue }}
        </th>
        <td mat-cell *matCellDef="let row">{{ row[column.value] }}</td>
      </ng-container>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let row; columns: columnsToDisplay"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="columnsToDisplay.length">
        <span *ngIf="!isLoading"
          >No se encontraron datos que coincidan con "{{ input.value }}"</span
        >
      </td>
    </tr>
  </table>

  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Cargando datos...</span>
  </div>
</div>
<mat-paginator
  [pageSizeOptions]="[5, 10, 25, 100]"
  showFirstLastButtons
  aria-label="Seleccionar página de visitas"
></mat-paginator>
